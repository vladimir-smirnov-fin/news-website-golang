{{ define "show" }}

{{ template "header" . }}

<br><br>

<main role="main" class="inner cover">
  {{ template "flash-messages" . }}

  <h1 class="cover-heading">{{ .Article.Title }}</h1>
  <p class="lead">{{ .Article.FullText }}</p>
  <p class="text-muted">Author: {{ .AuthorName }}</p>
  <br>
  <div class="d-flex justify-content-center align-items-center flex-wrap">
    <div class="mx-1">
      <a href="/" class="btn btn-secondary">Back</a>
    </div>
    {{ if .CanEdit }}
      <div class="mx-1">
        <a href="/article/{{ .Article.Id }}/edit" class="btn btn-warning">Edit</a>
      </div>
      <div class="mx-1">
        <form action="/article/{{ .Article.Id }}/delete" method="POST" class="d-inline">
          <button type="submit" class="btn btn-danger" 
            onclick="return confirm('Are you sure you want to delete this article?')">
            Delete
          </button>
        </form>
      </div>
    {{ end }}
  </div>
</main>

{{ template "footer" }}

{{ end }}
