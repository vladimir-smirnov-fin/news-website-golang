services:
  - type: web
    name: vladimir-smirnov-news-website-golang
    runtime: go
    repo: https://github.com/vladimir-smirnov-fin/news-website-golang
    plan: free
    buildCommand: go build -o main
    startCommand: ./main
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: go-news-db
          property: connectionString

databases:
  - name: go-news-db
    plan: free